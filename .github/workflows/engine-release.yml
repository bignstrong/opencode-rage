name: Engine Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag for engine assets
        required: true
        default: v0.1.0
      whisper_cpp_ref:
        description: whisper.cpp tag or commit
        required: true
        default: v1.8.2

permissions:
  contents: read

env:
  ENGINE_RELEASE_TAG: ${{ inputs.release_tag }}
  WHISPER_CPP_REF: ${{ inputs.whisper_cpp_ref }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            sidecar_binary: sidecar/target/release/opencode-voice-transcribe
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            sidecar_binary: sidecar/target/release/opencode-voice-transcribe
          - os: macos-14
            platform: darwin-x64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
            rust_target: x86_64-apple-darwin
            sidecar_binary: sidecar/target/x86_64-apple-darwin/release/opencode-voice-transcribe
          - os: macos-14
            platform: darwin-arm64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
            sidecar_binary: sidecar/target/release/opencode-voice-transcribe
          - os: windows-latest
            platform: win32-x64
            sidecar_binary: sidecar/target/release/opencode-voice-transcribe.exe

    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Add Rust cross-compilation target
        if: matrix.rust_target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git

      - name: Checkout whisper.cpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper_cpp_ref == 'v1.8.2' && '4979e04f5dcaccb36057e059bbaed8a2f5288315' || inputs.whisper_cpp_ref }}
          path: vendor/whisper.cpp
          persist-credentials: false

      - name: Configure whisper.cpp
        run: cmake -S vendor/whisper.cpp -B build/whisper.cpp -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF ${{ matrix.cmake_args }}
        shell: bash

      - name: Build whisper-cli
        run: cmake --build build/whisper.cpp --config Release --target whisper-cli --parallel 2
        shell: bash

      - name: Package engine asset
        run: node scripts/package-engine-asset.mjs --engine whisper.cpp --command whisper-cli --platform "${{ matrix.platform }}" --build build/whisper.cpp --out dist/engines --version "$WHISPER_CPP_REF"
        shell: bash

      - name: Build transcribe-cpp sidecar
        run: cargo build --locked --manifest-path sidecar/Cargo.toml --release ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
        shell: bash

      - name: Package transcribe-cpp sidecar
        run: node scripts/package-engine-asset.mjs --engine transcribe-cpp --command opencode-voice-transcribe --platform "${{ matrix.platform }}" --binary "${{ matrix.sidecar_binary }}" --out dist/engines --version "$(cargo metadata --locked --manifest-path sidecar/Cargo.toml --no-deps --format-version 1 | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(JSON.parse(s).packages[0].dependencies.find(d => d.name === "transcribe-cpp").req.replace("^", "")))')"
        shell: bash

      - name: Upload engine artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.platform }}
          path: dist/engines/*
          if-no-files-found: error

  assemble:
    name: Assemble engine registry
    runs-on: ubuntu-latest
    needs: build
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Download engine artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: engine-*
          path: dist/engines
          merge-multiple: true

      - name: Prepare release assets
        run: node scripts/build-engine-registry.mjs --dir dist/engines --repo "$GITHUB_REPOSITORY" --tag "$ENGINE_RELEASE_TAG" --version "$WHISPER_CPP_REF"
        shell: bash

      - name: Upload release assets
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/engines/*.gz
            dist/engines/registry.json
          if-no-files-found: error

  publish:
    name: Publish engine registry
    runs-on: ubuntu-latest
    needs: assemble
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          merge-multiple: true
          path: dist/engines

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.ENGINE_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: opencode-voice managed engines
          fail_on_unmatched_files: true
          files: |
            dist/engines/*.gz
            dist/engines/registry.json
