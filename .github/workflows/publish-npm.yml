name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Verify and pack
    runs-on: macos-15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - name: Build Mac runtime for both architectures
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm run build:native
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target" --manifest-path native/Cargo.toml
            cargo build --locked --release --target "$target" --manifest-path native/host/Cargo.toml
          done
          lipo -create native/target/{aarch64,x86_64}-apple-darwin/release/rage-core -output native/target/release/rage-core
          lipo -create native/host/target/{aarch64,x86_64}-apple-darwin/release/librage_host.dylib -output native/rage.node
          codesign --force --sign - native/target/release/rage-core
          codesign --force --sign - native/rage.node
      - run: npm run check

      - name: Pack verified sources
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
          mv "$RUNNER_TEMP"/npm-release/*.tgz "$RUNNER_TEMP/package.tgz"
          tar -xzf "$RUNNER_TEMP/package.tgz" -C "$RUNNER_TEMP/npm-release"
          cd "$RUNNER_TEMP/npm-release/package"
          node -e "if (typeof require('./native/rage.node').Session !== 'function') process.exit(1)"
          ./native/target/release/rage-core cli --help
          test -s src/native-runtime.js && test -s rage/core.js
          for file in native/rage.node native/target/release/rage-core; do
            for arch in arm64 x86_64; do lipo -verify_arch "$arch" "$file"; done
          done
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/package.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          merge-multiple: true
          path: npm-release

      - name: Publish tarball with OIDC
        env:
          PACKAGE_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$PACKAGE_SHA256" npm-release/package.tgz | sha256sum --check --strict
          npm publish ./npm-release/package.tgz --ignore-scripts --access public --registry=https://registry.npmjs.org
