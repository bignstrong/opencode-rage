name: Release Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-runtime:
    name: Build and test the Mac plugin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm run check
      - name: Compare native behavior to the reference
        run: |
          node rust/orbs-parity.mjs
          node rust/cli-parity.mjs
          cargo test --locked --manifest-path native/Cargo.toml
          cargo clippy --locked --manifest-path native/host/Cargo.toml --all-targets -- -D warnings

  check:
    name: Check and pack (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Coverage signal (informational, no threshold yet)
        run: node --experimental-test-coverage --test "test/*.test.js"

      - name: Pack dry run
        run: npm pack --dry-run --ignore-scripts
